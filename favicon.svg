<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Glowing Circular Recurring Arrow (Top Arc) -->
  <path d="M 120 256 A 140 140 0 0 1 390 190" fill="none" stroke="url(#glowGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)"/>
  <polygon points="390,150 425,200 370,215" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Glowing Circular Recurring Arrow (Bottom Arc) -->
  <path d="M 392 256 A 140 140 0 0 1 122 322" fill="none" stroke="url(#glowGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)"/>
  <polygon points="122,362 87,312 142,297" fill="#a855f7" filter="url(#neonGlow)"/>

  <!-- Credit Card Popping out of Wallet -->
  <rect x="180" y="165" width="165" height="100" rx="14" transform="rotate(-18 260 210)" fill="url(#cardGrad)" opacity="0.9" filter="url(#neonGlow)"/>
  <!-- Card Chip -->
  <rect x="200" y="200" width="30" height="24" rx="5" transform="rotate(-18 215 212)" fill="#fbbf24" opacity="0.95"/>

  <!-- Main Wallet Body -->
  <rect x="160" y="230" width="192" height="145" rx="24" fill="#1e1b4b" stroke="url(#glowGrad)" stroke-width="12" filter="url(#neonGlow)"/>
  
  <!-- Wallet Flap & Clasp -->
  <path d="M 160 270 L 352 270" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="6,6" opacity="0.6"/>
  <rect x="290" y="280" width="68" height="46" rx="14" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="10"/>
  <circle cx="332" cy="303" r="8" fill="#38bdf8"/>

  <!-- Sparkles -->
  <path d="M 380 130 Q 380 150 360 150 Q 380 150 380 170 Q 380 150 400 150 Q 380 150 380 130 Z" fill="#38bdf8" filter="url(#neonGlow)"/>
  <path d="M 140 370 Q 140 385 125 385 Q 140 385 140 400 Q 140 385 155 385 Q 140 385 140 370 Z" fill="#a855f7" filter="url(#neonGlow)"/>
</svg>
